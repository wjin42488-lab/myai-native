name: Build MY AI native (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp tag (leave empty = auto)"
        required: false
        default: ""
      arm_arch:
        description: "ARM arch"
        required: true
        default: "armv8.2-a+dotprod"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARM_ARCH: ${{ inputs.arm_arch || 'armv8.2-a+dotprod' }}
      LLAMA_REF_INPUT: ${{ inputs.llama_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip native kit
        run: |
          unzip -o native_kit.zip
          test -f native/CMakeLists.txt
          test -f native/myai_jni.cpp

      - name: Build (auto-pick llama.cpp tag, with fallback)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          REPO=https://github.com/ggml-org/llama.cpp.git
          CANDS=""
          if [ -n "$LLAMA_REF_INPUT" ]; then CANDS="$LLAMA_REF_INPUT"; fi
          B67=$(git ls-remote --tags --refs "$REPO" 'b67??' | sed 's#.*refs/tags/##' | sort -V | head -1 || true)
          if [ -n "$B67" ]; then CANDS="$CANDS $B67"; fi
          CANDS="$CANDS v0.2.0"
          echo "Candidate tags: $CANDS"
          OK=""
          for REF in $CANDS; do
            echo "=================== trying $REF ==================="
            rm -rf native/llama.cpp build
            if ! git clone --depth 1 --branch "$REF" "$REPO" native/llama.cpp; then
              echo "clone of $REF failed, next"
              continue
            fi
            if cmake -S native -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28 \
                -DANDROID_STL=c++_static \
                -DCMAKE_BUILD_TYPE=Release \
                -DMYAI_ARM_ARCH="$ARM_ARCH" \
              && cmake --build build --target myai_native -j"$(nproc)"; then
              OK="$REF"
              break
            fi
            echo "build with $REF failed, next"
          done
          if [ -z "$OK" ]; then
            echo "ALL CANDIDATES FAILED"
            exit 1
          fi
          echo "llama.cpp tag used: $OK" | tee build/llama_version.txt
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$BIN/llvm-strip" --strip-unneeded build/libmyai_native.so
          ls -lh build/libmyai_native.so
          "$BIN/llvm-readelf" -d build/libmyai_native.so | grep NEEDED
          "$BIN/llvm-nm" -D build/libmyai_native.so | grep Java_com_myai || true

      - uses: actions/upload-artifact@v4
        with:
          name: libmyai_native-arm64-v8a
          path: |
            build/libmyai_native.so
            build/llama_version.txt
