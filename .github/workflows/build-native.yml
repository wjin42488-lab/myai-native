name: Build MY AI native (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: "llama.cpp tag"
        required: true
        default: "b6674"
      arm_arch:
        description: "ARM arch"
        required: true
        default: "armv8.2-a+dotprod"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LLAMA_REF: ${{ inputs.llama_ref || 'b6674' }}
      ARM_ARCH: ${{ inputs.arm_arch || 'armv8.2-a+dotprod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip native kit
        run: |
          unzip -o native_kit.zip
          test -f native/CMakeLists.txt
          test -f native/myai_jni.cpp

      - name: Get llama.cpp
        run: |
          git clone --depth 1 --branch "$LLAMA_REF" https://github.com/ggml-org/llama.cpp.git native/llama.cpp
          git -C native/llama.cpp log -1 --format='llama.cpp %H %cd' | tee llama_version.txt

      - name: Configure
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S native -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DMYAI_ARM_ARCH="$ARM_ARCH"

      - name: Build
        run: cmake --build build --target myai_native -j"$(nproc)"

      - name: Strip and check
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$BIN/llvm-strip" --strip-unneeded build/libmyai_native.so
          ls -lh build/libmyai_native.so
          "$BIN/llvm-readelf" -d build/libmyai_native.so | grep NEEDED
          "$BIN/llvm-nm" -D build/libmyai_native.so | grep Java_com_myai || true
          cp llama_version.txt build/

      - uses: actions/upload-artifact@v4
        with:
          name: libmyai_native-arm64-v8a
          path: |
            build/libmyai_native.so
            build/llama_version.txt
